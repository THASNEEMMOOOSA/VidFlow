# docker-compose.yml
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: vidflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vidflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vidflow-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: vidflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vidflow-network

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: vidflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vidflow-network

  # FastAPI Backend
  backend:
    build: ./backend
    container_name: vidflow-backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/vidflow
      - REDIS_URL=redis://redis:6379/0
      - REDIS_BROKER_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - vidflow-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker
  celery-worker:
    build: ./backend
    container_name: vidflow-celery-worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/vidflow
      - REDIS_URL=redis://redis:6379/0
      - REDIS_BROKER_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - vidflow-network
    command: celery -A app.workers.celery_app worker --loglevel=info --queues=video_processing,thumbnail_generation,cleanup

  # Celery Beat (Scheduler)
  celery-beat:
    build: ./backend
    container_name: vidflow-celery-beat
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/vidflow
      - REDIS_URL=redis://redis:6379/0
      - REDIS_BROKER_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - vidflow-network
    command: celery -A app.workers.celery_app beat --loglevel=info

  # React Frontend
  frontend:
    build: ./frontend
    container_name: vidflow-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api/v1
      - REACT_APP_WS_URL=localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - vidflow-network
    command: npm start

  # Nginx for serving static files and reverse proxy
  nginx:
    image: nginx:alpine
    container_name: vidflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - vidflow-network

networks:
  vidflow-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: